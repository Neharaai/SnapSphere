name: Build and deploy Node.js app to Azure Web App - snapsphere-api
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
      - name: npm install
        working-directory: 'Backend Files'
        run: npm install
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: 'Backend Files'
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_AE260A723C1C489FBC24ECF7E4275924 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B5BFF9620C574F7B888D0DFAFF3E11DF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4229F0626C3446D382B7C2C310DA00FC }}
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'snapsphere-api'
          slot-name: 'Production'
          package: .